# GitHub Pages + jekyll-theme-hamilton
# https://github.com/ngzhio/jekyll-theme-hamilton


baseurl: ""
url: "https://seishiroono.github.io"

title: Seishiro Ono
author: "Seishiro Ono"
email: "s-ono@g.ecc.u-tokyo.ac.jp"
google_scholar: "https://scholar.google.co.jp/citations?user=TNFITl4AAAAJ&hl=en"
#description: "A minimal and beautiful site built with Hamilton."

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-scholar

# jekyll-scholar: Publication ページで BibTeX 文献リストを表示
scholar:
  source: ./_bibliography
  bibliography: references.bib
  sort_by: year
  order: descending
  style: apa
  locale: en
  bibliography_template: '{% if entry.url %}<a href="{{ entry.url | escape }}" target="_blank" rel="noopener noreferrer">{{ reference }}</a>{% else %}{{ reference }}{% endif %}'

remote_theme: ngzhio/jekyll-theme-hamilton


# オプション
lang: en
paginate: 10
date_format: "%Y-%m-%d"
#subscribe: true
